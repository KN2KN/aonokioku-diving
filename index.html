<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#052d38"><title>蒼の記憶 — 海底遺跡ダイビング</title><link rel="icon" href="data:,"> <link rel="stylesheet" href="style.css"></head><body><canvas id="sea" aria-label="海底遺跡の探索エリア"></canvas><header><div class="brand"><small>THE SUNKEN SANCTUARY</small><strong>蒼の記憶</strong></div><div class="toolbar"><button id="sound" aria-label="音を有効にする" aria-pressed="false">音 OFF</button><button id="pause" aria-label="一時停止">Ⅱ</button></div></header><section id="hud"><div class="airlabel"><span>酸素</span><b id="air">100</b><span>秒</span></div><div class="meter"><i id="bar"></i></div><div class="row"><span id="count">宝物 0 / 3</span><span id="bearing">船まで 0 m</span></div></section><canvas id="map" width="132" height="132" aria-label="宝物と船と現在位置の海域マップ"></canvas><div class="lens"></div><button id="quality" title="画質を切り替える">画質：自動</button><div id="reticle">＋</div><div id="lookhint">画面ドラッグで見回す</div><div id="message" role="status" aria-live="polite"></div><div id="compass">↑ <span>帰還地点</span></div><aside id="intro" class="overlay"><div class="card"><small>DIVE 01 / 忘れられた神殿</small><h1>海が隠した、<br><em>３つの記憶。</em></h1><p>光の差す遺跡で、３つの宝物を探そう。<br>酸素が尽きる前に、船のロープへ。</p><div class="rules"><span>◇ 近づくと宝物を回収</span><span>◉ 金色の輪が帰還地点</span></div><button class="primary" id="start" disabled>海底を準備中…</button><p class="hint">PC：WASDで移動・画面ドラッグ／←→で見回す<br>スマホ：左スティックで移動・画面ドラッグで見回す</p></div></aside><aside id="result" class="overlay hidden"><div class="card"><small id="resultTag">DIVE COMPLETE</small><h1 id="resultTitle"></h1><p id="resultText"></p><button class="primary" id="restart">もう一度潜る</button></div></aside><aside id="paused" class="overlay hidden"><div class="card"><small>TAKE A BREATH</small><h1>ひと休み</h1><p>酸素の消費は止まっています。</p><button class="primary" id="resume">探索に戻る</button></div></aside><div id="stick" aria-label="ドラッグして移動"><div id="knob"></div></div><footer>浅海調査 / 水深 18 m <span>BLENDER × WEBGL</span></footer><script type="module" src="game.js"></script></body></html>
